[package]
name = "mission-control"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
async-trait = "0.1"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
